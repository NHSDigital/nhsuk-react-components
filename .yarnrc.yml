nodeLinker: node-modules

npmMinimalAgeGate: "7d"

npmRegistryServer: "https://registry.yarnpkg.com"

packageExtensions:
  "@storybook/addon-docs@*":
    peerDependencies:
      "@types/react-dom": "*"
  storybook@*:
    peerDependencies:
      "@testing-library/dom": "*"
      react: "*"
      react-dom: "*"
  vite@*:
    peerDependencies:
      rollup: "*"
